name: Build Catnip

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner label
        default: macos-latest

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: ${{ inputs.runner || 'macos-latest' }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure (macOS, Universal – Apple Silicon + Intel)
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: cmake --build build --config Release --parallel 4 --target Catnip_AU Catnip_VST3 Catnip_Standalone

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --parallel 4 --target Catnip_VST3 Catnip_Standalone

      - name: Sign (ad-hoc) and package (macOS)
        if: runner.os == 'macOS'
        run: |
          OUT=build/Catnip_artefacts/Release
          for b in "$OUT/AU/Catnip.component" "$OUT/VST3/Catnip.vst3" "$OUT/Standalone/Catnip.app"; do
            codesign --force --deep --sign - "$b"
          done
          mkdir -p dist/Catnip-macOS
          cp -R "$OUT/AU/Catnip.component" "$OUT/VST3/Catnip.vst3" "$OUT/Standalone/Catnip.app" dist/Catnip-macOS/
          cp README.md dist/Catnip-macOS/LIESMICH.md

      - name: Validate Audio Unit (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R dist/Catnip-macOS/Catnip.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Ctnp Kina

      - name: Publish macOS build to branch mac-build
        if: runner.os == 'macOS' && github.ref == 'refs/heads/main'
        run: |
          cd dist/Catnip-macOS
          git init -q -b mac-build
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "macOS build ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" mac-build

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "build/Catnip_artefacts/Release"
          New-Item -ItemType Directory -Force -Path dist/Catnip-Windows | Out-Null
          Copy-Item -Recurse "$out/VST3/Catnip.vst3" dist/Catnip-Windows/
          Copy-Item "$out/Standalone/Catnip.exe" dist/Catnip-Windows/
          Copy-Item README.md dist/Catnip-Windows/LIESMICH.md

      - uses: actions/upload-artifact@v4
        with:
          name: Catnip-${{ matrix.name }}
          path: dist/Catnip-${{ matrix.name }}
